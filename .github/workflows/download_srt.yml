name: Download Platform Video and Zip

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'הכנס את הקישור לסרטון'
        required: true
        type: string

jobs:
  download-with-ytdlp:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --upgrade yt-dlp

      - name: Download Video using yt-dlp
        run: |
          mkdir -p downloads
          yt-dlp -o "downloads/video.%(ext)s" "${{ inputs.video_url }}"

      - name: Create ZIP archive
        run: |
          cd downloads
          zip -r video.zip *

      - name: Upload ZIP as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-archive
          path: downloads/video.zip
