name: Download Subtitle and Zip

on:
  workflow_dispatch:

jobs:
  download-and-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Create working directory
        run: mkdir -p downloads

      - name: Download SRT file
        run: |
          # הורדת קובץ הכתוביות הישיר תוך הימנעות מחסימות בסיסיות
          curl -L -A "Mozilla/5.0" "https://www.subtitlecat.com/subs/677/Oppenheimer.2023.1080p.BluRay.x264.AAC5.1-YTS.MX.EN-iw.srt" -o downloads/subtitles.srt

      - name: Create ZIP archive
        run: |
          cd downloads
          zip -r subtitles.zip subtitles.srt

      - name: Upload ZIP as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtitles-zip
          path: downloads/subtitles.zip
