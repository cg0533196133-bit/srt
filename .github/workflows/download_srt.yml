name: Download Subtitle via Playwright and Zip

on:
  workflow_dispatch:

jobs:
  download-and-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create working directory
        run: mkdir -p downloads

      - name: Run Playwright script to download file
        run: |
          node - e '
          const { chromium } = require("playwright");
          const fs = require("fs");
          const path = require("path");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            
            // גלישה לעמוד הנדרש
            await page.goto("https://www.subtitlecat.com/subs/677/Oppenheimer.2023.1080p.BluRay.x264.AAC5.1-YTS.MX.EN-iw.srt", { waitUntil: "networkidle" });

            // הגדרת האזנה לאירוע הורדה
            const [ download ] = await Promise.all([
              page.waitForEvent("download"),
              // איתור כפתור ההורדה לפי טקסט או מזהה ולחיצה עליו
              page.click("a#download_translated, a[href*=\".srt\"], a:has-text(\"Download\")")
            ]);

            // שמירת הקובץ בתיקיית היעד
            const downloadPath = path.join(process.cwd(), "downloads", "subtitles.srt");
            await download.saveAs(downloadPath);

            await browser.close();
          })();
          '

      - name: Create ZIP archive
        run: |
          cd downloads
          zip -r subtitles.zip subtitles.srt

      - name: Upload ZIP as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: subtitles-zip
          path: downloads/subtitles.zip
